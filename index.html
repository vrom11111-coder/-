<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Блинная - дашборд</title>
  <style>
    :root {
      --bg: #f6f7f4;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #68727d;
      --line: #dde2df;
      --green: #23715a;
      --blue: #256b9a;
      --red: #b84c4c;
      --yellow: #c28a25;
      --violet: #7256a3;
      --shadow: 0 10px 30px rgba(20, 30, 40, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 22px 28px 14px;
      background: #1d2d35;
      color: #fff;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0;
    }
    .sub { color: #cfdbdc; }
    main { padding: 20px 28px 34px; max-width: 1440px; margin: 0 auto; }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
      align-items: end;
    }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    select, input {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      padding: 10px 11px;
      border-radius: 6px;
      font: inherit;
    }
    .grid { display: grid; gap: 16px; }
    .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .layout { grid-template-columns: 1.15fr .85fr; align-items: start; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
      min-width: 0;
    }
    .kpi { min-height: 108px; display: grid; align-content: space-between; }
    .kpi span { color: var(--muted); font-weight: 700; font-size: 12px; }
    .kpi strong { font-size: 24px; line-height: 1.1; overflow-wrap: anywhere; }
    .kpi small { color: var(--muted); }
    h2 { margin: 0 0 12px; font-size: 17px; }
    .chart { width: 100%; height: 300px; display: block; }
    .chart.tall { height: 390px; }
    .axis, .tick { stroke: #c7d0cd; stroke-width: 1; }
    .gridline { stroke: #eef1ef; stroke-width: 1; }
    .label { fill: var(--muted); font-size: 11px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; color: var(--muted); }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 9px 8px; border-bottom: 1px solid #edf0ee; text-align: left; vertical-align: middle; }
    th { color: var(--muted); font-size: 12px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .good { color: var(--green); }
    .bad { color: var(--red); }
    .muted { color: var(--muted); }
    .barrow { display: grid; grid-template-columns: 125px 1fr 76px; gap: 10px; align-items: center; margin: 9px 0; }
    .track { height: 12px; background: #eef1ef; border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; background: var(--blue); }
    .notice { background: #fff8e7; border-color: #eed49a; }
    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      header, main { padding-left: 14px; padding-right: 14px; }
      .toolbar, .kpis { grid-template-columns: 1fr; }
      .kpi strong { font-size: 22px; }
      .barrow { grid-template-columns: 92px 1fr 62px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Блинная</h1>
    <div class="sub">Продажи, маржинальность, расходы и точка безубыточности</div>
  </header>
  <main>
    <section class="toolbar">
      <label>Период с<input id="dateFrom" type="date"></label>
      <label>Период по<input id="dateTo" type="date"></label>
      <label>Категория<select id="categoryFilter"></select></label>
      <label>Метрика<select id="metricFilter">
        <option value="revenue">Выручка</option>
        <option value="gross">Вал</option>
        <option value="profit">Прибыль</option>
        <option value="qty">Шт</option>
      </select></label>
    </section>

    <section class="grid kpis" id="kpis"></section>

    <section class="grid layout" style="margin-top:16px">
      <div class="panel">
        <h2>Динамика по дням</h2>
        <svg id="trendChart" class="chart tall" role="img" aria-label="Динамика по дням"></svg>
        <div class="legend">
          <span><i class="dot" style="background:var(--blue)"></i>Выбранная метрика</span>
          <span><i class="dot" style="background:var(--red)"></i>Точка безубыточности</span>
        </div>
      </div>
      <div class="panel">
        <h2>Категории</h2>
        <div id="categoryBars"></div>
      </div>
    </section>

    <section class="grid layout" style="margin-top:16px">
      <div class="panel">
        <h2>Топ товаров</h2>
        <table>
          <thead><tr><th>Товар</th><th>Категория</th><th class="num">Выручка</th><th class="num">Вал</th></tr></thead>
          <tbody id="topTable"></tbody>
        </table>
      </div>
      <div class="panel">
        <h2>Безубыточность по месяцам</h2>
        <svg id="monthChart" class="chart" role="img" aria-label="Безубыточность по месяцам"></svg>
      </div>
    </section>

    <section class="panel notice" style="margin-top:16px">
      <h2>Процесс</h2>
      <table>
        <thead><tr><th>Показатель</th><th class="num">Значение</th><th>Комментарий</th></tr></thead>
        <tbody id="processTable"></tbody>
      </table>
    </section>
  </main>

    function filteredDaily() {
      const from = parseDate(byId('dateFrom').value);

      const category = byId('categoryFilter').value;
      if (category === 'Все') {
        return DATA.daily.filter(r => parseDate(r.Дата) >= from && parseDate(r.Дата) <= to);

      for (const r of DATA.categories) {
        const d = parseDate(r.Дата);

        const base = dayMap.get(r.Дата) || { Дата: r.Дата, Выручка: 0, Шт: 0, Вал: 0, 'Точка безуб. выручка/день': 0, 'Прибыль после расходов': 0 };

    }

    function renderTrend(rows) {
      const metricKey = { revenue: 'Выручка', gross: 'Вал', profit: 'Прибыль после расходов', qty: 'Шт' }[byId('metricFilter').value];
      const svg = byId('trendChart');
      const w = svg.clientWidth || 900, h = svg.clientHeight || 390;
      const pad = { l: 58, r: 16, t: 18, b: 42 };
      const values = rows.map(r => r[metricKey] || 0);
      const breakEven = rows.map(r => r['Точка безуб. выручка/день'] || 0);
      const s = scale([...values, ...breakEven], .02);
      const x = i => pad.l + (rows.length <= 1 ? 0 : i * (w - pad.l - pad.r) / (rows.length - 1));
      const y = v => pad.t + (s.max - v) * (h - pad.t - pad.b) / (s.max - s.min || 1);
      const points = values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
      const bePoints = breakEven.map((v, i) => `${x(i)},${y(v)}`).join(' ');
      let grid = '';
      for (let i = 0; i <= 4; i++) {
        const gy = pad.t + i * (h - pad.t - pad.b) / 4;
        const gv = s.max - i * (s.max - s.min) / 4;
        grid += `<line class="gridline" x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}"></line><text class="label" x="4" y="${gy+4}">${fmt.format(Math.round(gv))}</text>`;
      }
      const labels = rows.filter((_, i) => i % Math.ceil(rows.length / 7) === 0).map((r, i, arr) => {
        const idx = rows.indexOf(r);
        return `<text class="label" x="${x(idx)-22}" y="${h-14}">${r.Дата.slice(5)}</text>`;
      }).join('');
      svg.innerHTML = `${grid}<line class="axis" x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}"></line>${labels}<polyline points="${bePoints}" fill="none" stroke="var(--red)" stroke-width="2" stroke-dasharray="5 5"></polyline><polyline points="${points}" fill="none" stroke="var(--blue)" stroke-width="3"></polyline>`;
    }

    function renderCategoryBars() {
      const totals = filteredCategoryTotals();
      const max = Math.max(1, ...totals.map(t => t.revenue));
      byId('categoryBars').innerHTML = totals.map((t, i) => `
        <div class="barrow">
          <strong>${t.category}</strong>
          <div class="track"><div class="fill" style="width:${t.revenue / max * 100}%;background:${COLORS[i % COLORS.length]}"></div></div>
          <span class="num">${rub(t.revenue)}</span>
        </div>
        <div class="muted" style="margin: -4px 0 8px 135px">Вал: ${rub(t.gross)} · ${pct(t.revenue ? t.gross / t.revenue : 0)} · ${num(t.qty)} шт</div>
      `).join('');
    }

    function renderTop() {
      const selected = byId('categoryFilter').value;
      const rows = DATA.topProducts
        .filter(r => selected === 'Все' || r.category === selected)
        .slice(0, 10);
      byId('topTable').innerHTML = rows.map(r => `<tr><td>${r.name}</td><td>${r.category}</td><td class="num">${rub(r.revenue)}</td><td class="num">${rub(r.gross)}</td></tr>`).join('');
    }

    function renderMonthChart() {
      const svg = byId('monthChart');
      const rows = DATA.months;
      const w = svg.clientWidth || 500, h = svg.clientHeight || 300;
      const pad = { l: 55, r: 14, t: 20, b: 38 };
      const max = Math.max(...rows.map(r => Math.max(r.Выручка, r['Точка безуб. выручка'])), 1);
      const bw = (w - pad.l - pad.r) / rows.length / 3;
      const y = v => pad.t + (max - v) * (h - pad.t - pad.b) / max;
      let body = '';
      rows.forEach((r, i) => {
        const base = pad.l + i * (w - pad.l - pad.r) / rows.length + bw;
        body += `<rect x="${base}" y="${y(r.Выручка)}" width="${bw}" height="${h-pad.b-y(r.Выручка)}" fill="var(--green)"></rect>`;
        body += `<rect x="${base + bw + 3}" y="${y(r['Точка безуб. выручка'])}" width="${bw}" height="${h-pad.b-y(r['Точка безуб. выручка'])}" fill="var(--yellow)"></rect>`;
        body += `<text class="label" x="${base-4}" y="${h-14}">${r.Месяц.slice(5)}</text>`;
      });
      svg.innerHTML = `<line class="axis" x1="${pad.l}" y1="${h-pad.b}" x2="${w-pad.r}" y2="${h-pad.b}"></line>${body}`;
    }

    function renderProcess(rows) {
      const fixed = rows.reduce((s, r) => s + (r['Расходы/день'] || 0), 0);
      const staff = rows.reduce((s, r) => s + (r['Стафф себес'] || 0), 0);
      const revenue = rows.reduce((s, r) => s + (r.Выручка || 0), 0);
      const gross = rows.reduce((s, r) => s + (r.Вал || 0), 0);
      const be = rows.reduce((s, r) => s + (r['Точка безуб. выручка/день'] || 0), 0);
      const gap = revenue - be;
      byId('processTable').innerHTML = [
        ['Постоянные расходы', rub(fixed), 'аренда, персонал, маркетинг и прочие расходы из листа Экономика'],
        ['Стафф себестоимость', rub(staff), 'еда персонала по себестоимости'],
        ['Фудкост', pct(revenue ? 1 - gross / revenue : 0), 'доля себестоимости в выручке'],
        ['Запас к безубыточности', rub(gap), gap >= 0 ? 'выше точки безубыточности' : 'не хватает до точки безубыточности']
      ].map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td>${r[2]}</td></tr>`).join('');
    }

    function render() {
      const rows = filteredDaily();
      renderKpis(rows);
      renderTrend(rows);
      renderCategoryBars();
      renderTop();
      renderMonthChart();
      renderProcess(rows);
    }
    window.addEventListener('resize', render);
    render();
  </script>
</body>
</html>
